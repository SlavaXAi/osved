name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.9.11
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check app tests
      - run: uv run --frozen pytest
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t osved:ci .
      - run: docker run --rm osved:ci osved doctor
