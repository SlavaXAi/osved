[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "osved"
version = "0.1.0"
description = "Personal Telegram news radar with YouTube and X sources"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.31,<4",
  "aiohttp>=3.14.3,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "Telethon>=1.44,<2",
  "typer>=0.16,<1",
  "reportlab>=4.4,<5",
  "yt-dlp==2025.10.14",
  "yandex-music==3.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
osved = "app.cli:main"
newsfeed = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
