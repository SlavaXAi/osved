name: osved
services:
  newsfeed:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
      SOURCES_FILE: /app/config/sources.yaml
      INTERESTS_FILE: /app/config/interests.yaml
      STYLE_PROFILE_FILE: /app/config/style-profile.yaml
      SENSORY_SOURCES_FILE: /app/config/sensory-sources.yaml
      CONTOURS_FILE: /app/config/contours.yaml
      SEARCH_AGENTS_FILE: /app/config/search-agents.yaml
      X_AUTHORS_FILE: /app/config/x-authors.yaml
      WEEKLY_PERSONAS_FILE: /app/config/weekly-personas.yaml
      FRONTIER_IDEAS_FILE: /app/config/frontier-ideas.yaml
      TELEGRAM_SESSION_PATH: /app/data/telegram-reader.session
    volumes:
      - data:/app/data
      - exports:/app/exports
      - ./config:/app/config:ro
    init: true
    restart: unless-stopped
    command: [osved, serve]
    stop_grace_period: 60s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -m, app.ops.healthcheck]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
volumes:
  data:
  exports:
