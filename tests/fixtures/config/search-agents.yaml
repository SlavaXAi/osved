  - east_asia
  max_events: 4
  instructions: 'Ищи не ежедневный шум рынков, а уже принятые решения и новые данные,
    которые меняют условия капитала, торговли, ресурсов или промышленного производства:
    ставки, тарифы, экспорт и импорт, валютную инфраструктуру, энергоресурсы и промышленную
    политику. Для каждого события назови практическое следствие для компаний или отраслей.
    Не возвращай прогноз курса, биржевой обзор или партийный комментарий без действия.
    Смотри также на ставки ФРС, кредит, БРИКС, дедолларизацию с проверяемыми данными
    и торговлю России, Китая, Индии. Различай торговые потоки и политические заявления;
    не вводи обязательное число событий на подтему.'
- id: geopolitics
  title: Геополитика и военные технологии
  enabled: true
  prompt_version: geopolitics_v2
  topics:
  - geopolitics
  - defense_technology
  - sanctions
  - sovereignty
  - alliances
  regions:
  - global
  - united_states
  - china
  - russia
  - cis
  - europe
  - east_asia
  max_events: 4
  instructions: 'Ищи конкретные действия государств и блоков, меняющие свободу действий,
    доступ к технологиям или баланс сил: договоры, санкции, экспортный контроль, оборонные
    развёртывания, союзы, переговорные решения и технологический суверенитет России,
    Китая, США, Европы и Азии. Отделяй официальный факт от интерпретации. Не возвращай
    партийную перепалку, прогноз войны или цитату без последовавшего решения. Это
    самостоятельное приоритетное направление, не только военные технологии. Следи
    за войнами, прекращением огня, существенными дипломатическими решениями, изменениями
    союзов и баланса сил России и Украины, США и Европы, НАТО, Китая, Японии, Южной
    и Северной Кореи, Тайваня и Филиппин, Ирана, Израиля, Саудовской Аравии и Центральной
    Азии; также за Anduril и Palantir. Пиши о подтверждённых возможностях и последствиях
    без тактических инструкций.'
