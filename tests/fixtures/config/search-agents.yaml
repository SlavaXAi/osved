lenses:
- id: frontier_global
  title: Глобальный технологический фронтир
  enabled: true
  prompt_version: frontier_global_v2
  topics:
  - ai
  - agents
  - startups
  - venture_capital
  - technology_economy
  - world_economy
  regions:
  - global
  - united_states
  - europe
  max_events: 4
  instructions: 'Ищи глобальные технологические и предпринимательские сдвиги: новые
    рынки и бизнес-модели, сильные стартапы и фонды, заметные раунды с понятной ставкой,
    изменения экономики компаний, AI-агентов и крупные платформенные изменения. Для
    моделей требуй capability, benchmark, цену, контекст или прямое сравнение. Снижай
    повторяемость чипов, дата-центров и одних компаний; ищи независимые компании и
    события вне Big Tech. Это мягкий приоритет: сильные события не исключай ради разнообразия
    и не добавляй слабые, чтобы заполнить выдачу.'
- id: china_asia_industry
  title: Китай и Азия — поперечный радар
  enabled: true
  prompt_version: china_asia_industry_v3
  topics:
  - ai
  - startups
  - space
  - trade
  - institutions
  - manufacturing
  - industrial_economy
  regions:
  - china
  - east_asia
  max_events: 4
  instructions: 'Ищи на английском и упрощённом китайском недооценённые события Китая
    и Азии: новые компании и рынки, промышленную политику, фабрики и массовое производство,
    роботизацию, энергетику, транспорт, логистику, китайский open source и изменения
    цепочек поставок. В одной выдаче допускай не больше одного чисто компонентного
    события про чипы или микроэлектронику и не больше одного события про гуманоидов
    или embodied AI. Обязательно ищи вне этих пузырей: конечные товары, батареи и
    энергетику, логистику, экспорт, фабричные мощности и новые производственные методы.
    Производство — лишь один из контекстов. Ищи также стартапы, software, космос,
    торговые потоки и содержательные заявления китайских людей и институтов. Предпочитай
    страницы компаний, биржевые сообщения, государственные документы и местные качественные
    медиа. Существенные конфликты, торговые решения и изменения баланса сил в Азии
    также интересны сами по себе, даже без связи с технологиями.'
- id: russia_cis_dual_use
  title: Россия, СНГ и dual-use технологии
  enabled: true
  prompt_version: russia_cis_dual_use_v2
  topics:
