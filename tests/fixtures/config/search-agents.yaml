  - united_states
  - china
  - russia
  - europe
  - east_asia
  max_events: 4
  instructions: 'Ищи изменения реальной экономики компаний: новая модель продаж, заметное
    изменение производительности труда, себестоимости или маржи, перенос капитальных
    расходов, новый способ финансировать производство и доказанный сдвиг unit economics.
    Это не лента инвестфонда: не возвращай долговые размещения, движение акций, оценку
    или раунд без понятного операционного механизма и последствия. Деньги и проценты
    оставляй в тексте, а заголовок строй вокруг самого изменения. Ищи разные механизмы
    и отрасли: pricing и бизнес-модель, производительность труда, производство, платежи
    или оборотный капитал. Не заполняй выдачу релизами AI-agent software без измеренного
    операционного результата.'
- id: world_economy
