  - china
  - united_states
  - russia
  - europe
  - east_asia
  max_events: 4
  instructions: 'Ищи конкретные свежие решения и изменения, которые сдвигают условия
    для бизнеса, технологий и промышленности: ставки и капитал, торговые режимы, экспортный
    контроль, санкции, ресурсы, союзы, государственные инвестиции и промышленную политику
    России, Китая, США, Европы и Азии. Нужен совершившийся факт, документ или измеримое
    действие, а не ежедневный рыночный шум, прогноз курса, партийная перепалка или
    общая аналитика.'
- id: frontier_ideas
  title: Край карты науки и идей
  enabled: true
  prompt_version: frontier_ideas_v1
  topics:
  - consciousness
  - longevity
  - future_studies
  - computation
  - ai_welfare
  - civilization
  regions:
  - global
  max_events: 4
  instructions: 'Ищи свежий институциональный передний край науки и технологической
    философии: сознание и AI welfare, whole-brain emulation, долголетие, природу вычислений,
    квантовую информацию, будущее цивилизации и формальные модели необычных идей.
    Нужен новый paper, программа лаборатории, грант, эксперимент, корпоративная политика
    или сильная публичная работа уважаемого автора. Чётко отличай эмпирический результат,
    формальную модель, проверяемую гипотезу, философию, футуризм и fiction. Не выдавай
    старую вечную идею за новость и не превращай форумный пост в доказательство. Reddit,
    LessWrong и другие форумы используй как радары новых технофилософских обсуждений
    и мемов. Описывай их как дискуссию или культурный сигнал; научные утверждения
    сверяй отдельно. Сильный аргумент или новая постановка вопроса могут быть ценны
    без нового гранта, но старую идею явно датируй.'
