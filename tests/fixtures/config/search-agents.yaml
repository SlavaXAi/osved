  - cis
  max_events: 4
  instructions: 'Ищи на русском и английском измеримые изменения России и СНГ: новые
    технологические компании, внедрения, промышленность, логистику, энергетику, оборонные
    и автономные системы, крупные инвестиции и государственные решения с практическим
    следствием. Кибербезопасность включай только при крупном государственном, экономическом
    или геополитическом последствии. Не считай меморандум, намерение или отдельную
    CVE полноценным событием. Не заполняй всю выдачу электроникой и инфраструктурой.'
- id: personal_rare_signals
  title: Редкие персонально полезные сигналы
  enabled: true
  prompt_version: personal_rare_signals_v2
  topics:
  - agents
  - startups
  - fintech
  - construction
  - open_source
  - frontier_science_and_ideas
  regions:
  - global
  max_events: 4
  instructions: 'Ищи редкие, но сильные события: новые бизнес-модели и AI-native стартапы,
    агентов как экономических участников, fintech, строительство и сложные B2B-процессы,
    open source с реальным внедрением, а также институциональный передний край науки
    о сознании, долголетии, вычислениях и будущем цивилизации. Последнее включай только
    при новом исследовании, программе, финансировании или решении уважаемого института,
    а спекулятивность называй прямо. Это линза редкости, а не слабости: no-name проект
    без traction и вечная идея без нового события не подходят.'
- id: startup_capital
  title: Стартапы, рынки и движение капитала
  enabled: true
  prompt_version: startup_capital_v2
  topics:
  - startups
  - venture_capital
  - business_models
  - yc
  - a16z
  - company_economics
  regions:
  - global
  - united_states
  - china
  - europe
  - russia
  max_events: 4
  instructions: 'Ищи свежие события о стартапах и формировании рынков: новые продукты
    с реальным спросом, первые крупные клиенты, необычные бизнес-модели, резкий traction,
    сделки, изменения unit economics, YC и сильные акселераторы, a16z и другие фонды.
    Приоритет у продукта, спроса и нового рынка. Не заполняй выдачу по квоте. Раунд
    допустим только вместе с понятным продуктом и измеримым traction; сумму оставляй
    в summary, не делай её заголовком. Не возвращай подборки «10 стартапов», очередной
    AI-wrapper или простой факт финансирования. В выдаче должны по возможности быть
    разные отрасли; сильные исключения допустимы.'
- id: world_strategy
  title: Мировая экономика и геостратегия
  enabled: false
  prompt_version: world_strategy_v1
  topics:
