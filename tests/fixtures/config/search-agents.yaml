  instructions: 'Ищи совершившиеся изменения в физическом мире: введённые мощности,
    работающие пилоты и коммерческие развёртывания в космосе, робототехнике, логистике,
    строительстве, энергетике и инфраструктуре. Объясняй, какой объект или процесс
    появился и что изменилось в стоимости, скорости или масштабе. Не возвращай концепт-арты,
    обещания без площадки и срока, обычные чиповые релизы или новости, где единственный
    смысл — сумма инвестиций.'
- id: company_capital
  title: Экономика компании и капитал
  enabled: false
  prompt_version: company_capital_v2
  topics:
