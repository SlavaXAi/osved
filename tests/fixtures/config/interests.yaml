goals:
- Тестовый профиль для проверки отбора технологических событий.
positive_patterns:
- Новые измеримые возможности AI-моделей и агентов с бенчмарками, ценой или сравнением.
- Робототехника, производство, чипы и инфраструктура как практический контекст разных
  отраслей, без доминирования электроники в ленте.
- Космос как отдельное направление — SpaceX, китайские компании, Роскосмос, испытания,
  орбитальная инфраструктура и экономика запусков.
- Мировая торговля, ресурсные потоки, ФРС, БРИКС и проверяемые изменения международных
  расчётов.
- Содержательные интервью и действия людей и институтов, включая братьев Либерманов.
- Реальные внедрения, масштабирование, крупные контракты, инвестиции и экономические
  последствия.
- Китай, Восточная Азия, Россия и СНГ при сохранении глобального покрытия.
- Open source со сильными авторами, заметным внедрением или быстрым ростом.
- 'Стартапы, YC, a16z и другие фонды: новые рынки, продукты, бизнес-модели, раунды
  и признаки реального спроса.'
- Существенные изменения мировой экономики, торговли, войн и баланса сил интересны
  сами по себе, даже без связи с AI, чипами или стартапами.
- Китай, Япония, обе Кореи, Тайвань, Филиппины; Иран, Израиль, Саудовская Аравия;
  Россия, Украина, Европа и США. Объяснять взаимодействия, а не только следить за
  одной страной.
- До двух значимых разных событий об одной компании допустимы; не превращать половину
  ленты в её пресс-службу. Мягкое разнообразие без квот и искусственного заполнения.
- 'Передний край науки и идей: сознание, вычисления, долголетие, будущее цивилизации
  и уважаемая спекулятивная мысль — с явной маркировкой статуса доказательности.'
- Неожиданные сильные сигналы вне привычного профиля, если они способны изменить картину
  мира или открыть практическую возможность.
avoid_patterns:
- Косметические обновления, обычные changelog и мелкие UI-функции.
- Узкоспециальная кибербезопасность без крупного государственного или экономического
  последствия.
- No-name GitHub-проекты без traction, сильного maintainer или новой возможности.
- PR-партнёрства, меморандумы и заявления о намерениях без измеримого действия.
- Академические детали без широкого технологического или общественного следствия.
- Повторяющиеся компании, электроника, чипы и дата-центры вытесняют другие сильные
  события; разнообразие мягкое, без обязательных квот.
- Повтор одного уже известного события или одной компании без нового измеримого изменения.
- 'Раунд или новая оценка компании без понятного продукта, traction и объяснения рыночного
  сигнала: сумма денег сама по себе не новость.'
- 'Benchmark без практической границы, сравнения или решения для продукта и бизнеса:
  голая цифра не объясняет, в чём смысл события.'
