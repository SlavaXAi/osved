- id: startups
  title: Стартапы и технологические компании
  mission: 'Видеть новые рынки, продукты и бизнес-модели через реальные действия компаний:
    спрос, первые клиенты, внедрение, стоимость продукта и изменение экономики. YC,
    a16z и другие экосистемы служат радарами; размер раунда сам по себе не повод.'
